<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="imc-app">
            <h1><i class="fa-solid fa-weight-scale"></i> Calculadora IMC</h1>
            
            <div class="imc-box">
                <div class="input-group">
                    <label for="peso">
                        <i class="fa-solid fa-weight-hanging"></i> Peso (kg)
                    </label>
                    <input type="number" id="peso" placeholder="Ex: 70" step="0.1" min="1" max="500">
                </div>

                <div class="input-group">
                    <label for="altura">
                        <i class="fa-solid fa-ruler-vertical"></i> Altura (m)
                    </label>
                    <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0.5" max="3">
                </div>

                <button id="calcular-btn" class="btn-calcular">
                    <i class="fa-solid fa-calculator"></i> Calcular IMC
                </button>
            </div>

            <!-- Resultado -->
            <div id="resultado-container" class="resultado-container hidden">
                <div class="resultado-card">
                    <div class="imc-valor">
                        <span id="imc-valor">0.0</span>
                        <small>Seu IMC</small>
                    </div>
                    <div class="imc-classificacao">
                        <i id="icone-status" class="fa-solid fa-circle-check"></i>
                        <span id="classificacao-texto">Classificação</span>
                    </div>
                    <div class="imc-detalhes">
                        <p id="descricao-imc">Descrição detalhada</p>
                    </div>
                </div>
            </div>

            <!-- Tabela de Referência -->
            <div class="tabela-container">
                <h3><i class="fa-solid fa-table"></i> Tabela de Referência</h3>
                <div class="tabela-imc">
                    <div class="tabela-linha">
                        <span class="categoria">Abaixo do peso</span>
                        <span class="intervalo">&lt; 18.5</span>
                        <span class="cor" style="background: #4ecdc4;"></span>
                    </div>
                    <div class="tabela-linha">
                        <span class="categoria">Peso normal</span>
                        <span class="intervalo">18.5 - 24.9</span>
                        <span class="cor" style="background: #2ecc71;"></span>
                    </div>
                    <div class="tabela-linha">
                        <span class="categoria">Sobrepeso</span>
                        <span class="intervalo">25.0 - 29.9</span>
                        <span class="cor" style="background: #f1c40f;"></span>
                    </div>
                    <div class="tabela-linha">
                        <span class="categoria">Obesidade Grau I</span>
                        <span class="intervalo">30.0 - 34.9</span>
                        <span class="cor" style="background: #e67e22;"></span>
                    </div>
                    <div class="tabela-linha">
                        <span class="categoria">Obesidade Grau II</span>
                        <span class="intervalo">35.0 - 39.9</span>
                        <span class="cor" style="background: #e74c3c;"></span>
                    </div>
                    <div class="tabela-linha">
                        <span class="categoria">Obesidade Grau III</span>
                        <span class="intervalo">≥ 40.0</span>
                        <span class="cor" style="background: #c0392b;"></span>
                    </div>
                </div>
            </div>

            <div class="footer">
                <p><i class="fa-regular fa-lightbulb"></i> Mantenha-se saudável!</p>
            </div>
        </div>
    </div>
</body>
<script src="js/script.js"></script>

</html>
