<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
    <title>Calculadora</title>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <h1><i class="fa-solid fa-calculator"></i> Calculadora</h1>
            
            <div class="display-container">
                <input type="text" id="display" readonly>
                <span id="historico"></span>
            </div>

            <div class="box-buttons">
                <button class="btn-limpar" onclick="limpar()">AC</button>
                <button class="btn-back" onclick="voltar()"><i class="fa-solid fa-delete-left"></i></button>
                <button class="btn-operador" onclick="inserirDisplay('/')">÷</button>
                <button class="btn-operador" onclick="inserirDisplay('*')">×</button>
                
                <button onclick="inserirDisplay('7')">7</button>
                <button onclick="inserirDisplay('8')">8</button>
                <button onclick="inserirDisplay('9')">9</button>
                <button class="btn-operador" onclick="inserirDisplay('-')">−</button>
                
                <button onclick="inserirDisplay('4')">4</button>
                <button onclick="inserirDisplay('5')">5</button>
                <button onclick="inserirDisplay('6')">6</button>
                <button class="btn-operador" onclick="inserirDisplay('+')">+</button>
                
                <button onclick="inserirDisplay('1')">1</button>
                <button onclick="inserirDisplay('2')">2</button>
                <button onclick="inserirDisplay('3')">3</button>
                <button class="btn-resultado" onclick="calcular()">=</button>
                
                <button class="btn-zero" onclick="inserirDisplay('0')">0</button>
                <button onclick="inserirDisplay('.')">.</button>
            </div>
        </div>
    </div>
</body>
<script src="js/script.js"></script>
</html>
